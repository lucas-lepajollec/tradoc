version: '3.8'

services:
  tradoc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradoc-server
    restart: unless-stopped
    ports:
      - "2507:8000"
    environment:
      - ENV=production
      - DATA_DIR=/app/data
      - LLM_ENDPOINT=http://192.168.x.x:1234/v1
      - LLM_API_KEY=lm-studio
      - LLM_MODEL=qwen3.5-9b
      - API_TYPE=openai
      - CONCURRENCY=1
      - CHUNK_TOKEN_SIZE=1000
      - TEMPERATURE=1.50
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/models"]
      interval: 30s
      timeout: 10s
      retries: 3
