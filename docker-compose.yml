version: '3.8'

services:
  tradoc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradoc-server
    restart: unless-stopped
    ports:
      - "2507:8000"
    environment:
      - ENV=production
      - DATA_DIR=/app/data
      - APP_SECRET=  # Optionnel: définissez un mot de passe pour sécuriser l'accès à l'API
      - ALLOWED_ORIGINS=*  # Ex: http://localhost:2507,http://192.168.1.50:2507
      - LLM_ENDPOINT=http://localhost:1234/v1
      - LLM_API_KEY=lm-studio
      - LLM_MODEL=qwen3.5-instruct
      - API_TYPE=openai
      - CHUNK_TOKEN_SIZE=1000
      - TEMPERATURE=0.15
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/models"]
      interval: 30s
      timeout: 10s
      retries: 3
