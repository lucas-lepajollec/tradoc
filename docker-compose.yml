services:
  tradoc:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradoc:local
    container_name: tradoc-server
    restart: unless-stopped
    ports:
      - "${TRADOC_BIND_ADDRESS:-127.0.0.1}:2507:8000"
    environment:
      - ENV=production
      - DATA_DIR=/app/data
      - APP_SECRET=${APP_SECRET:?Définissez APP_SECRET dans le fichier .env}
      - ALLOWED_ORIGINS=
      - LLM_ENDPOINT=http://host.docker.internal:1234/v1
      - LLM_API_KEY=lm-studio
      - LLM_MODEL=qwen3.5-instruct
      - API_TYPE=lm-studio
      - CHUNK_TOKEN_SIZE=1000
      - TEMPERATURE=0.15
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=128m,uid=1000,gid=1000,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
