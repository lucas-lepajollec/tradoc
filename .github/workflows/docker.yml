name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to rebuild exactly (for example v0.1.1)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.release_ref || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lucas-lepajollec/tradoc

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Test backend
        env:
          GITHUB_REF_TYPE: ${{ inputs.release_ref != '' && 'tag' || github.ref_type }}
          GITHUB_REF_NAME: ${{ inputs.release_ref || github.ref_name }}
        run: |
          pip install -r requirements.txt
          python scripts/check_version.py
          python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate frontend
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: web
        run: npm run test:e2e

  publish:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Resolve source revision
        id: source
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if [[ -n "$RELEASE_REF" && ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_ref must be an existing SemVer tag such as v0.1.1" >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.release_ref == '' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' && inputs.release_ref == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' && inputs.release_ref == '' }}
            type=semver,pattern={{version}},value=${{ inputs.release_ref }},enable=${{ inputs.release_ref != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_ref }},enable=${{ inputs.release_ref != '' }}
            type=sha,prefix=sha-,format=long,enable=${{ inputs.release_ref == '' }}
            type=raw,value=sha-${{ steps.source.outputs.sha }},enable=${{ inputs.release_ref != '' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
