<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="blue-spark" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container Box -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="12" />
  
  <!-- Subtle Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#2563eb" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Main Open Book Icon (Left Page & Right Page) -->
  <g stroke="url(#blue-spark)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Page -->
    <path d="M256 360C220 330 160 330 110 345V165C160 150 220 150 256 180" />
    <!-- Right Page -->
    <path d="M256 360C292 330 352 330 402 345V165C352 150 292 150 256 180" />
    <!-- Book Spine Center Line -->
    <path d="M256 180V360" stroke="#60a5fa" stroke-width="22" />
  </g>

  <!-- AI Translation Sparkles -->
  <g fill="url(#blue-spark)">
    <!-- Big Sparkle -->
    <path d="M340 100L348 122L370 130L348 138L340 160L332 138L310 130L332 122Z" />
    <!-- Small Sparkle -->
    <path d="M170 120L175 133L188 138L175 143L170 156L165 143L152 138L165 133Z" />
  </g>
</svg>
